<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Thông báo liên hệ mới - NHT</title></head>
<body style="margin:0;padding:0;background:#f5f3f3;color:#1b1c1c;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f3f3;padding:32px 16px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fff;border:1px solid #e4e2e2">
        <tr><td style="padding:30px 40px;border-bottom:1px solid #e4e2e2">
          <table role="presentation" width="100%"><tr><td><img src="cid:nht-logo" width="300" alt="NHT Accounting" style="display:block;width:100%;max-width:300px;height:auto;border:0"></td><td align="right"><span style="padding:7px 10px;background:#e9e8e7;font-size:11px;text-transform:uppercase">Internal</span></td></tr></table>
        </td></tr>
        <tr><td style="padding:40px">
          <h1 style="margin:0 0 10px;font-size:32px">Thông báo liên hệ mới</h1>
          <p style="margin:0 0 30px;color:#5a4139;font-size:16px;line-height:1.6">Website vừa ghi nhận một yêu cầu tư vấn mới.</p>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-top:1px solid #e4e2e2">
            <tr><td style="width:160px;padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Tên khách hàng</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;font-weight:700">{{name}}</td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Email</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2"><a href="mailto:{{email}}" style="color:#a73400">{{email}}</a></td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Số điện thoại</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2"><a href="tel:{{phone}}" style="color:#a73400">{{phone}}</a></td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Công ty</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2">{{company}}</td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Mã số thuế</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2">{{taxCode}}</td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase">Dịch vụ</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2">{{service}}</td></tr>
            <tr><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;color:#5f5e5e;font-size:12px;text-transform:uppercase;vertical-align:top">Lời nhắn</td><td style="padding:16px 8px;border-bottom:1px solid #e4e2e2;white-space:pre-wrap">{{message}}</td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:22px;background:#fbf9f8;border-top:1px solid #e4e2e2;color:#5f5e5e;font-size:12px">Nhận lúc {{submittedAt}} · Mã yêu cầu: {{leadId}}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
