<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập admin | NHT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: "#e05915",
              hover: "#bf480d",
              light: "#fff7ed"
            },
            navy: {
              DEFAULT: "#0f172a",
              light: "#1e293b",
              muted: "#475569"
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-50 text-navy selection:bg-brand/10 selection:text-brand">
  <main id="adminLoginPage" class="invisible flex min-h-screen items-center justify-center px-6 py-12">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-premium">
      <a href="index.html" class="mb-8 inline-flex items-center">
        <img src="../picture/logo-transparent.png" alt="NHT Logo" class="h-10 w-auto max-w-[160px] object-contain" />
      </a>

      <div class="mb-8">
        <p class="text-sm font-bold uppercase tracking-wider text-brand">Admin</p>
        <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-navy">Đăng nhập quản trị</h1>
      </div>

      <form id="adminLoginForm" class="space-y-5">
        <div>
          <label for="adminUsername" class="mb-2 block text-sm font-semibold text-slate-700">Tài khoản</label>
          <input
            id="adminUsername"
            name="username"
            type="text"
            autocomplete="username"
            required
            value="admin"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-navy outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/10"
          />
        </div>

        <div>
          <label for="adminPassword" class="mb-2 block text-sm font-semibold text-slate-700">Mật khẩu</label>
          <input
            id="adminPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-navy outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/10"
          />
        </div>

        <button
          type="submit"
          class="inline-flex w-full items-center justify-center rounded-xl bg-brand px-5 py-3 text-sm font-bold text-white shadow-md shadow-brand/10 transition hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-70"
        >
          Đăng nhập
        </button>

        <p id="adminLoginNotice" class="min-h-5 text-sm font-medium text-slate-500" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
